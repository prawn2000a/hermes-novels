name: Unstick GitHub Pages deployment

# 解除卡喺 in_progress 嘅 github-pages deployment。
# 症狀：之後所有 pages 部署都回 400
#   "Deployment request failed ... due to in progress deployment.
#    Please cancel <sha> first or wait for it to complete."
#
# 順序：先 POST status=inactive 釋放環境鎖，再 DELETE 部署記錄。
on:
  push:
    paths:
      - '.github/workflows/unstick-pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  deployments: write
  contents: write
  pages: write

jobs:
  unstick:
    name: Cancel stuck deployments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Unstick and report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          {
            echo "## Pages deploy 診斷"
            echo
            echo "run: $GITHUB_RUN_ID  sha: $GITHUB_SHA"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          api() {
            local code
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "$@" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28")
            echo "- \`$code\` $(head -c 400 /tmp/body | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
            echo "$code"
          }

          echo "### GET deployments" >> "$GITHUB_STEP_SUMMARY"
          api "https://api.github.com/repos/$REPO/deployments?per_page=100" >/dev/null

          python3 - <<'PY' > /tmp/ids
          import json
          try:
              data = json.load(open('/tmp/body'))
          except Exception:
              raise SystemExit(0)
          if isinstance(data, dict):
              raise SystemExit(0)
          for d in data:
              if d.get('environment') == 'github-pages':
                  print(d['id'])
          PY
          echo "### deployment ids" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ids >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          for id in $(cat /tmp/ids); do
            echo "### POST inactive $id" >> "$GITHUB_STEP_SUMMARY"
            api -X POST "https://api.github.com/repos/$REPO/deployments/$id/statuses" \
              -d '{"state":"inactive","description":"auto-cancelled by unstick workflow"}' >/dev/null
            echo "### DELETE $id" >> "$GITHUB_STEP_SUMMARY"
            api -X DELETE "https://api.github.com/repos/$REPO/deployments/$id" >/dev/null
          done

          echo "### POST pages/builds" >> "$GITHUB_STEP_SUMMARY"
          api -X POST "https://api.github.com/repos/$REPO/pages/builds" >/dev/null
