<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#eae2d3;--bg-warm:#e1d8c9;--ink:#34312c;--ink-light:#5a5248;--accent:#6b5b4a;--accent-light:#8b745d;--line:#c9beae;--card-bg:#f0e9dc;}
body{font-family:"Noto Sans TC","Helvetica Neue",sans-serif;font-weight:500;background:var(--bg);color:var(--ink);line-height:1.8;font-size:16px;letter-spacing:0.02em;padding:80px 12vw;}
.back-link{font-size:14px;color:var(--ink-light);text-decoration:none;margin-bottom:48px;display:inline-block;}
.back-link:hover{color:var(--accent);}
.series-header{margin-bottom:64px;}
.series-label{font-size:13px;font-weight:600;letter-spacing:0.2em;color:var(--ink-light);text-transform:uppercase;margin-bottom:12px;}
.series-title{font-family:"Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:clamp(36px,6vw,64px);font-weight:700;margin-bottom:16px;line-height:1.1;}
.series-subtitle{font-size:17px;color:var(--ink-light);margin-bottom:32px;max-width:720px;}
.series-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px;}
.series-tag{font-size:13px;font-weight:600;padding:4px 12px;border:1px solid var(--line);border-radius:24px;color:var(--ink-light);}
.series-progress{font-size:14px;font-weight:600;color:var(--accent);margin-top:16px;}
.chapter-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:48px;}
.chapter-row{background:var(--bg);padding:18px 24px;display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink);transition:background .2s;}
.chapter-row:hover{background:var(--bg-warm);}
.chapter-info{display:flex;align-items:center;gap:20px;}
.chapter-num{font-family:"Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:18px;font-weight:700;color:var(--accent);min-width:56px;}
.chapter-title{font-size:16px;font-weight:600;color:var(--ink);}
.chapter-status{font-size:13px;font-weight:500;color:var(--ink-light);}
.chapter-row.done .chapter-status{color:var(--accent);}
</style>
