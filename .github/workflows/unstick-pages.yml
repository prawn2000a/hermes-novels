name: Unstick GitHub Pages deployment

# 只喺本 workflow 檔案被改動時觸發 —— 避免每次 push 都重複執行。
# 用途：解除卡喺 in_progress 嘅 github-pages deployment。
# 症狀：之後所有部署都回 400
#   "Deployment request failed ... due to in progress deployment.
#    Please cancel <sha> first or wait for it to complete."
on:
  push:
    paths:
      - '.github/workflows/unstick-pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  deployments: write
  contents: read
  pages: write

jobs:
  unstick:
    name: Cancel stuck deployments
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose and cancel stuck github-pages deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          api() {
            curl -sS -o /tmp/body -w '%{http_code}' "$@" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28"
          }

          echo "### token perms"
          api "https://api.github.com/repos/$REPO" > /tmp/code
          cat /tmp/code; echo; cat /tmp/body | head -c 400; echo

          echo "### list github-pages deployments"
          api "https://api.github.com/repos/$REPO/deployments?per_page=50" > /tmp/code
          cat /tmp/code; echo
          python3 - <<'PY' > /tmp/ids
          import json
          try:
              data = json.load(open('/tmp/body'))
          except Exception:
              raise SystemExit(0)
          if isinstance(data, dict):
              raise SystemExit(0)
          for d in data:
              if d.get('environment') == 'github-pages':
                  print(d['id'])
          PY
          echo "deployment ids:"; cat /tmp/ids

          for id in $(cat /tmp/ids); do
            echo "### DELETE deployment $id"
            api -X DELETE "https://api.github.com/repos/$REPO/deployments/$id" > /tmp/code
            echo -n "http "; cat /tmp/code; echo; head -c 400 /tmp/body; echo

            echo "### POST status inactive on $id"
            api -X POST "https://api.github.com/repos/$REPO/deployments/$id/statuses" \
              -d '{"state":"inactive","description":"auto-cancelled by unstick workflow"}' > /tmp/code
            echo -n "http "; cat /tmp/code; echo; head -c 400 /tmp/body; echo
          done

          echo "### try building pages directly"
          api -X POST "https://api.github.com/repos/$REPO/pages/builds" > /tmp/code
          echo -n "http "; cat /tmp/code; echo; head -c 400 /tmp/body; echo
